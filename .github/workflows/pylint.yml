
name: Fuxing V1 - Prueba sin GPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn requests beautifulsoup4 pandas openpyxl
          pip install torch xgboost lightgbm numba

      - name: Ejecutar Fuxing y medir tiempo
        run: |
          echo "INICIO: $(date -u)"
          /usr/bin/time -v python -u FuxingV1_Git.py
          echo "FIN: $(date -u)"
